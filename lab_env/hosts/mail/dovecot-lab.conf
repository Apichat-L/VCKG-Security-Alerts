# Lab: plain-text IMAP logins without TLS (credentials cross the network in clear), Maildir in the user's home.
# Logins (success and "auth failed") go to syslog -> /var/log/syslog for the Wazuh agent (stock dovecot decoder).
protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:~/Maildir
log_path = syslog
syslog_facility = mail
auth_verbose = yes
