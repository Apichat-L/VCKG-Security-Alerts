; Gitea for the lab (lab_env/hosts/gitea). Dummy secrets, lab only.
APP_NAME = Lab Git
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /var/lib/gitea

[server]
PROTOCOL = http
HTTP_PORT = 3000
DOMAIN = git.lab.local
ROOT_URL = http://10.10.20.24:3000/
DISABLE_SSH = true
OFFLINE_MODE = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = /var/lib/gitea/data/gitea.db

; Gitea -> Redis (lab/asset_edges.csv): cache on the DATA zone's Redis, no password
[cache]
ADAPTER = redis
HOST = redis://10.10.30.34:6379/0?pool_size=10&idle_timeout=180s

[session]
PROVIDER = db

[security]
INSTALL_LOCK = true
SECRET_KEY = lab-not-a-secret
INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYmYiOjE3MDAwMDAwMDB9.lab-not-a-secret-internal-token

[oauth2]
JWT_SECRET = bGFiLW5vdC1hLXNlY3JldC1qd3Qtc2VjcmV0LTAwMDA

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false

[repository]
ROOT = /var/lib/gitea/repositories

; Log file (gitea.log) for the Wazuh agent (no stock decoder: collected as plain lines).
[log]
MODE = file
LEVEL = info
ROOT_PATH = /var/log/gitea
