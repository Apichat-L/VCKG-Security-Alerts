# API (APP, 10.10.20.21) -> Redis (DATA, 7.2.4, unauthenticated).
# CVE-2024-46981 (CVSS 9.8 CRITICAL): Redis Lua scripting collectgarbage() use-after-free.
# In Redis 7.2.0-7.2.6 (fix=7.2.7), Lua's collectgarbage("count") is callable from
# EVAL scripts. A crafted sequence of GC calls combined with Lua object manipulation
# can trigger a use-after-free in the Lua heap, potentially allowing RCE. Confirmed:
# EVAL calling collectgarbage() returns the status reply (Lua GC accessible unauthenticated).
# Redis 7.2.4 is in the vulnerable range.
# No Suricata CVE tag; generic rule 86601 (cross-zone APP->DATA).
