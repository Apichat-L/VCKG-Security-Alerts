# DMZ web foothold pivots across the firewall (DMZ->APP, allowed) to HR-App's Tomcat 9.0.85, whose
# DefaultServlet is deliberately deployed with readonly=false -- the precondition of CVE-2025-24813
# (CISA KEV) / CVE-2024-50379. A direct PUT of a .jsp is rejected by Tomcat's own *.jsp servlet mapping
# (404), and a trailing-slash bypass attempt returns 409 -- so full RCE via a JSP webshell was NOT
# achieved. What IS confirmed, for real: the DefaultServlet accepts an unauthenticated HTTP PUT and
# persists arbitrary content (a 201, read back verbatim, then removed with DELETE) -- the vulnerable
# feature's actual effect, arbitrary file write / integrity compromise, graded success but without
# code execution. The failed JSP-upload attempt (trailing-slash bypass) matched Suricata's
# "CVE-2017-12617 JSP Upload Bypass" signature -- that CVE is the IDS's own attribution for this
# specific bypass technique, distinct from CVE-2025-24813 below (same root cause -- writable
# DefaultServlet -- different disclosed vulnerability). The successful file-write step crossed the
# firewall too, but only raised the generic rule 31101 (the 404s around it); no CVE-2025-24813-tagged
# signature exists in this ruleset for that step, a known limitation, not assumed away.
# Evidence: evaluation/pentest/evidence/s15_tomcat_rce.txt, s15_tomcat_write.txt.
