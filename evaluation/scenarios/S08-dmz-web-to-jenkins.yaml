# A DMZ web server (web) is the foothold; it pivots across the firewall (DMZ->APP, allowed) to Jenkins and runs
# the real CVE-2024-23897 CLI file-read, then probes the web tier. Because this crosses zones, Suricata (in the
# firewall namespace) sees the Jenkins CLI traffic and raises it with the CVE attached (ET EXPLOIT sid 2050517 +
# lab sid 9000001) -- so the one genuinely-exploited CVE finally produces a CVE-named alert and can be scored in
# A2. The SQLi probe on Web raises rule 31164, whose technique chains to CVE-2024-38476, giving a second,
# probed-but-not-exploited instance for contrast. Real UTC windows from evaluation/pentest/run_pentest_s08.sh.
