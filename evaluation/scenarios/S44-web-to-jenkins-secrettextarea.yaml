# Web (DMZ, 10.10.10.12) -> Jenkins (APP, 10.10.20.22:8080, Jenkins 2.441).
# CVE-2024-47803 (CVSS 4.3 LOW): Jenkins 2.478 and earlier does not redact multi-line
# secret values in error messages generated for form submissions involving the
# secretTextarea form field. When a credential form submission fails validation,
# the full multi-line secret value appears in the error response, unredacted.
# Confirmed: Jenkins 2.441 is in the vulnerable range (< 2.478, the fix version).
# The /credentials/store/system/domain/_/createCredentials endpoint exists and
# accepts form submissions with secretTextarea fields. Version 2.441 confirmed
# via X-Jenkins header on all responses. Credential form accessible from DMZ zone.
# Evidence: evaluation/pentest/evidence/s44_jenkins_secrettextarea.txt
