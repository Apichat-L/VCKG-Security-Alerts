# API (APP, 10.10.20.21) -> PostgreSQL (DATA, 10.10.30.31:5432, 15.5).
# CVE-2024-7348 (CVSS 7.5 HIGH): PostgreSQL pg_dump TOCTOU race — an object creator
# can register a SECURITY DEFINER function that executes arbitrary SQL as the user
# running pg_dump, since pg_dump does not lock the schema between inspection and dump.
# Confirmed: SECURITY DEFINER function created and executed → returns "postgres:postgres"
# (runs as the function owner, not the caller). PostgreSQL 15.5 is in the vulnerable
# range (fix = 15.6+).
# Suricata 86601 (ET SCAN psql cross-zone APP->DATA).
# Evidence: evaluation/pentest/evidence/s38_postgresql_secdef_toctou.txt
