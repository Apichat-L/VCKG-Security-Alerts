# Web (DMZ, 10.10.10.12) -> Jenkins (APP, 10.10.20.22:8080, Jenkins 2.441).
# CVE-2024-23898 (CVSS 8.8 HIGH): Jenkins 2.217-2.441 does not perform origin
# validation of requests made through the CLI WebSocket endpoint. An attacker can
# make a cross-origin WebSocket request to /cli (or /cli/) to execute CLI commands
# without CSRF protection. Confirmed: GET /cli/ with WebSocket upgrade headers and
# Origin: http://evil.example.com returns HTTP 200 with full CLI command listing
# (Jenkins 2.441, X-Jenkins: 2.441). The endpoint accepts the connection regardless
# of Origin, confirming no origin validation. All CLI commands are listed.
# Suricata 86601 (ET HUNTING curl User-Agent cross-zone DMZ->APP).
# Evidence: evaluation/pentest/evidence/s35_jenkins_websocket_cli.txt
