# CVE-2026-21721 (CVSS 8.1 HIGH): Grafana dashboard permissions API does not validate
# the target dashboard scope. An Editor can call POST /api/dashboards/uid/{uid}/permissions
# to grant themselves or others Admin-level permissions on any dashboard without the
# system verifying that the caller actually has admin scope on that dashboard.
