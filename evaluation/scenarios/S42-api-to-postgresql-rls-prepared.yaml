# API (APP, 10.10.20.21) -> PostgreSQL (DATA, 10.10.30.31:5432, 15.5).
# CVE-2024-10976 (CVSS 5.4 MEDIUM): Incomplete tracking in PostgreSQL of tables with
# row security allows a reused query to view or change different rows from those intended.
# In PostgreSQL 15.5, cached/prepared query plans do not properly re-evaluate RLS
# policies when SET ROLE changes the current user mid-session, allowing rows from other
# roles to be inadvertently exposed. Confirmed: RLS table created, PREPARE + EXECUTE run
# as lowpriv → 0 rows (but plan reuse across SET ROLE changes is the vulnerable surface).
# PostgreSQL 15.5 is in the vulnerable range (fix = 15.6+, CVE-2023-2455 follow-on).
# Suricata 86601 (ET SCAN psql cross-zone APP->DATA).
# Evidence: evaluation/pentest/evidence/s42_postgresql_rls_prepared.txt
