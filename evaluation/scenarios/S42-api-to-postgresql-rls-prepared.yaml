        -> PostgreSQL 15.5 (Debian 15.5-1.pgdg120+1)
      CREATE TABLE rls_test_42 (id int, data text, owner_name text);
      INSERT INTO rls_test_42 VALUES (1,'admin_secret_data','postgres');
      INSERT INTO rls_test_42 VALUES (2,'lowpriv_data','lowpriv');
      ALTER TABLE rls_test_42 ENABLE ROW LEVEL SECURITY;
      CREATE POLICY rls42_pol ON rls_test_42 FOR SELECT USING (owner_name = current_user);
      CREATE USER lowpriv WITH PASSWORD 'lowpass'; GRANT SELECT ON rls_test_42 TO lowpriv;
      PREPARE rls42_check AS SELECT id, data FROM rls_test_42;
      SET ROLE lowpriv;
      EXECUTE rls42_check; -> 0 rows (filtered by RLS)
      RESET ROLE;
      SELECT version() LIKE 'PostgreSQL 15.5%' -> t (vulnerable version confirmed)
      CVE-2024-10976: in certain combined query / UNION / subquery contexts,
      the prepared plan does not recheck RLS on role change, exposing other users' rows.
      PostgreSQL 15.5 is in vulnerable range; fix is 15.6+.
      DROP TABLE rls_test_42; (cleaned up)
